<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZNS-FTL 3D Visualizer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="hud">
    <h2>ZNS-FTL 3D Visualizer</h2>
    <p>모드: <strong id="mode-text">Conventional FTL</strong></p>
    <p>WAF (쓰기 증폭 지수): <strong id="waf-text">1.00</strong></p>
    <p>Valid(초록): <span id="valid-count">0</span> | Invalid(빨강): <span id="invalid-count">0</span> | Empty(회색): <span id="empty-count">16</span></p>
  </div>

  <div id="controls">
    <button id="btn-mode">Mode: FTL ↔ ZNS 전환</button>
    <button id="btn-write">+ Write Data (데이터 쓰기)</button>
    <button id="btn-update">Update Data (데이터 수정)</button>
    <button id="btn-gc">Trigger GC / Zone Reset</button>
  </div>

  <div id="canvas-container"></div>
  <script src="main.js"></script>
</body>
</html>
